{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="content">
  <div class="container-fluid">
    <div class="card border-0 shadow-sm rounded-3 mt-4">
      <div class="card-header bg-light border-0 d-flex align-items-center">
        <h4 class="card-title mb-0 text-primary">
          <i class="ti ti-alert-triangle me-2"></i> Delete Priority
        </h4>
      </div>
      <div class="card-body">
        <p class="fs-3 mb-4">
          Are you sure you want to delete <strong>"{{ object }}"</strong>?  
          This may affect tasks linked to this priority.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-end mt-4">
            <a href="{% url 'priority-list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-danger">
              <i class="ti ti-trash me-1"></i> Delete Priority
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
