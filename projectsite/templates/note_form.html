{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="content">
  <div class="container-fluid">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-light border-0 d-flex justify-content-between align-items-center">
        <div>
          <h4 class="card-title mb-1 text-info">
            {% if object %}<i class="ti ti-edit me-2"></i> Update Note {% else %}<i class="ti ti-plus me-2"></i> Add New Note {% endif %}
          </h4>
          <p class="card-category text-muted mb-0">
            Keep short notes to complement your tasks.
          </p>
        </div>
      </div>

      <div class="card-body px-4 pb-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'includes/form.html' %}

          <div class="d-flex justify-content-end mt-4">
            <a href="{% url 'note-list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-info text-white btn-rounded px-4">
              <i class="ti ti-check me-1"></i> Save Note
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
