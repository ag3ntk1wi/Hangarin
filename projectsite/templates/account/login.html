{% load socialaccount %}
{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Hangarin</title>
  <link rel="shortcut icon" type="image/png" href="{% static 'images/logos/favicon-new.png' %}" />
  <link rel="stylesheet" href="{% static 'css/styles.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* --- Optional styling tweaks for buttons and layout --- */
    .btn i {
      vertical-align: middle;
    }
    .btn-outline-danger:hover {
      background-color: #dc3545;
      color: #fff;
      border-color: #dc3545;
    }
    .btn-outline-dark:hover {
      background-color: #000;
      color: #fff;
      border-color: #000;
    }
    .divider {
      position: relative;
      text-align: center;
    }
    .divider hr {
      margin: 1rem 0;
    }
    .divider span {
      background: #fff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0 10px;
      font-size: 0.875rem;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0">
              <div class="card-body">
                <a href="{% url 'home' %}" class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <img src="{% static 'images/logos/hangarin-logo-new.svg' %}" width="180" alt="Hangarin Logo">
                </a>
                <p class="text-center text-muted mb-4">Login to your Hangarin account</p>

                <!-- ✅ Login Form -->
                <form method="post" action="{% url 'account_login' %}">
                  {% csrf_token %}
                  <div class="mb-3">
                    <label for="id_login" class="form-label">Username</label>
                    <input type="text" name="login" class="form-control" id="id_login" required>
                  </div>
                  <div class="mb-4">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                  </div>
                  <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                      <input class="form-check-input primary" type="checkbox" value="remember" id="flexCheckChecked" checked>
                      <label class="form-check-label text-dark" for="flexCheckChecked">
                        Remember this Device
                      </label>
                    </div>
                    <a class="text-primary fw-bold small" href="javascript:void(0)">Forgot Password?</a>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mb-3 rounded-2">
                    Sign In
                  </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                  <hr>
                  <span>or</span>
                </div>

                <!-- ✅ Social Login Buttons -->
                <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100 py-2 mb-3 rounded-2">
                  <i class="fab fa-google me-2"></i> Continue with Google
                </a>

                <a href="{% provider_login_url 'github' %}" class="btn btn-outline-dark w-100 py-2 mb-4 rounded-2">
                  <i class="fab fa-github me-2"></i> Continue with GitHub
                </a>

                <!-- Signup link -->
                <div class="d-flex align-items-center justify-content-center">
                  <p class="fs-6 mb-0 text-muted">New to Hangarin?</p>
                  <a class="text-primary fw-bold ms-2" href="{% url 'account_signup' %}">Create an account</a>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script>
  <script src="{% static 'libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
