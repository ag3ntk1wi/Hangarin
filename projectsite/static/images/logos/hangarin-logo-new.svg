<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" fill="none">
  <defs>
    <!-- Blue gradient for grid -->
    <linearGradient id="lightBlueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Grid Icon -->
  <g id="grid" transform="translate(10,20)">
    <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#lightBlueGradient)"/>
    <rect x="26" y="0" width="20" height="20" rx="4" fill="url(#lightBlueGradient)"/>
    <rect x="0" y="26" width="20" height="20" rx="4" fill="url(#lightBlueGradient)"/>
    <rect x="26" y="26" width="20" height="20" rx="4" fill="url(#lightBlueGradient)"/>
  </g>

  <!-- Text: Hangarin, aligned visually with grid -->
  <text x="80" y="60" font-family="Segoe UI, Poppins, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="600" fill="#000">
    Hangarin
  </text>
</svg>
